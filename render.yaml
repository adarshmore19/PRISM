services:
  - type: web
    name: prism-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: development
      - key: AUTH_DEV_TOKENS_ENABLED
        value: "true"
      - key: AUTH_OIDC_ENABLED
        value: "true"
      - key: AUTH_OIDC_ISSUER
        value: https://tuaeujvuuanadqvykugw.supabase.co/auth/v1
      - key: AUTH_OIDC_JWKS_URI
        value: https://tuaeujvuuanadqvykugw.supabase.co/auth/v1/.well-known/jwks.json
      - key: AUTH_OIDC_AUDIENCE
        value: authenticated
      - key: AUTH_OIDC_ALGORITHMS
        value: ES256,RS256
      - key: AUTH_OIDC_IDENTITY_PROVIDER
        value: supabase
