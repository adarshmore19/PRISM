services:
  - type: web
    name: prism-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: development
      - key: AUTH_DEV_TOKENS_ENABLED
        value: "true"
      - key: AUTH_OIDC_ENABLED
        value: "true"
      - key: AUTH_OIDC_ISSUER
        value: https://tuaeujvuuanadqvykugw.supabase.co/auth/v1
      - key: AUTH_OIDC_JWKS_URI
        value: https://tuaeujvuuanadqvykugw.supabase.co/auth/v1/.well-known/jwks.json
      - key: AUTH_OIDC_AUDIENCE
        value: authenticated
      - key: AUTH_OIDC_ALGORITHMS
        value: ES256,RS256
      - key: AUTH_OIDC_IDENTITY_PROVIDER
        value: supabase
      - key: REDIS_URL
        sync: false
      - key: REDIS_REQUIRED
        value: "false"
      - key: S3_ENDPOINT
        value: https://tuaeujvuuanadqvykugw.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: ap-south-1
      - key: S3_USE_SSL
        value: "true"
      - key: S3_QUARANTINE_BUCKET
        value: pofa-quarantine
      - key: S3_EVIDENCE_BUCKET
        value: pofa-evidence
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: STORAGE_REQUIRED
        value: "false"
